<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  #emotes { position: absolute; inset: 0; pointer-events: none; }
  .emote { position: absolute; left: 0; top: 0; width: 150px; height: 130px; transform-origin: 75px 65px; }
  #caption {
    position: absolute; left: 50%; top: 60%;
    font-weight: 900; font-size: 92px; letter-spacing: -1px; white-space: nowrap;
    -webkit-text-stroke: 16px #0b0b0f; paint-order: stroke fill;
    text-shadow: 0 8px 0 rgba(0,0,0,0.45);
    transform-origin: 50% 50%;
  }
  #caption.trader { color: #ffffff; }
  #caption.claude { color: #ffc24b; }
  #caption.gpt { color: #4ff2d6; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
  <div id="emotes"></div>
  <div id="caption"></div>
</div>
<script src="../build/app.js"></script>
</body>
</html>
